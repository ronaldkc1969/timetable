<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>令和8年度 社会福祉学科 時間割</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; background: #f0f4f8; color: #333; }

/* ── ヘッダー ── */
.header {
  background: linear-gradient(135deg, #1a3a5c, #2a6496);
  color: white;
  padding: 18px 24px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.04em; }
.header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 4px; }

/* ── 学年タブ ── */
.year-tabs {
  display: flex;
  background: #1a3a5c;
  padding: 0 16px;
  gap: 4px;
}
.year-tab {
  padding: 10px 28px;
  cursor: pointer;
  color: rgba(255,255,255,0.6);
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: 6px 6px 0 0;
  transition: all 0.2s;
  border: none;
  background: transparent;
}
.year-tab:hover { color: white; background: rgba(255,255,255,0.1); }
.year-tab.active { background: #f0f4f8; color: #1a3a5c; }

/* ── 学期タブ ── */
.term-bar {
  display: flex;
  align-items: center;
  background: #eef3f8;
  border-bottom: 2px solid #d0dcea;
  padding: 0 20px;
}
.term-label { font-size: 0.78rem; color: #6a7f96; font-weight: 600; margin-right: 12px; }
.term-tab {
  padding: 8px 26px;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 700;
  border: none;
  background: transparent;
  color: #6a7f96;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}
.term-tab:hover { color: #2a6496; }
.term-tab.active-spring { color: #c0392b; border-bottom-color: #c0392b; background: rgba(192,57,43,0.06); }
.term-tab.active-autumn { color: #2c5282; border-bottom-color: #2c5282; background: rgba(44,82,130,0.06); }

/* ── レジェンド ── */
.content { padding: 18px 20px; }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  background: white;
  padding: 10px 16px;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.74rem; color: #555; }
.legend-dot  { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.legend-sep  { width: 1px; height: 18px; background: #ddd; margin: 0 4px; }
.new-badge-legend {
  display: inline-flex; align-items: center; gap: 3px;
  background: #fff3cd; border: 1.5px solid #f0b429;
  color: #856404; font-size: 0.68rem; font-weight: 800;
  padding: 1px 6px; border-radius: 10px;
}

/* ── テーブル ── */
.timetable-wrapper {
  overflow-x: auto;
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 18px;
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

/* 列ヘッダー（時限） */
thead th {
  background: #1a3a5c;
  color: white;
  text-align: center;
  font-size: 0.82rem;
  font-weight: 700;
  white-space: nowrap;
  padding: 0;
}
thead th.day-col-header { width: 54px; background: #0f2540; }
thead th.period-col {
  border-left: 2px solid #2e5d8c;
}
.period-head-inner {
  padding: 8px 6px 6px;
  line-height: 1.3;
}
.period-head-inner .period-num { font-size: 0.9rem; font-weight: 800; }
.period-head-inner .period-time { font-size: 0.65rem; opacity: 0.75; margin-top: 2px; }

/* 行ヘッダー（曜日） */
td.day-label {
  background: #dce9f5 !important;
  text-align: center;
  font-size: 1.05rem;
  font-weight: 900;
  color: #1a3a5c;
  vertical-align: middle;
  width: 54px;
  padding: 6px 4px;
  border-right: 3px solid #8cadc8;
  border-top: 3px solid #8cadc8;
  border-bottom: none;
}

/* セル */
td.slot {
  vertical-align: top;
  padding: 5px;
  border-left: 2px solid #d4e2f0;
  border-top: 3px solid #b8cfe6;
  border-bottom: none;
  min-width: 120px;
}
tbody tr:first-child td.slot,
tbody tr:first-child td.day-label { border-top: none; }

tbody tr:nth-child(even) td.slot { background: #f3f8fd; }
tbody tr:nth-child(odd)  td.slot { background: #ffffff; }

/* ── 科目カード ── */
.subject-card {
  border-radius: 5px;
  padding: 4px 6px;
  margin-bottom: 3px;
  font-size: 0.7rem;
  line-height: 1.4;
  cursor: default;
  transition: transform 0.1s, box-shadow 0.1s;
  border-left: 3px solid transparent;
  position: relative;
}
.subject-card:hover {
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(0,0,0,0.14);
  z-index: 10;
}
.subject-card:last-child { margin-bottom: 0; }
.subject-name { font-weight: 700; font-size: 0.72rem; }
.subject-meta { font-size: 0.64rem; opacity: 0.75; margin-top: 1px; }

.subject-type-badge {
  display: inline-block;
  font-size: 0.6rem;
  padding: 1px 4px;
  border-radius: 3px;
  font-weight: 600;
}
.term-badge {
  display: inline-block;
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 10px;
  font-weight: 700;
}
.term-通 { background: #e8f8e8; color: #276220; }

.subject-card.is-new {
  box-shadow: 0 0 0 1.5px #f0b429;
  outline: none;
}
.subject-card.is-new::before {
  content: '★ NEW';
  position: absolute;
  top: -1px; right: -1px;
  background: #f0b429;
  color: #5a3800;
  font-size: 0.55rem;
  font-weight: 900;
  padding: 1px 4px;
  border-radius: 0 4px 0 4px;
  line-height: 1.5;
  letter-spacing: 0.02em;
}

/* 科目種別カラー */
.type-基幹必修 { background:#fff0f0; border-color:#e74c3c; }
.type-基幹必修 .subject-type-badge { background:#e74c3c; color:white; }
.type-基幹選択 { background:#fff5eb; border-color:#e67e22; }
.type-基幹選択 .subject-type-badge { background:#e67e22; color:white; }
.type-言語     { background:#eef4ff; border-color:#3498db; }
.type-言語 .subject-type-badge { background:#3498db; color:white; }
.type-共通選択 { background:#f0faf0; border-color:#27ae60; }
.type-共通選択 .subject-type-badge { background:#27ae60; color:white; }
.type-資格     { background:#f5f0ff; border-color:#8e44ad; }
.type-資格 .subject-type-badge { background:#8e44ad; color:white; }
.type-ゼミ     { background:#e8faf8; border-color:#16a085; }
.type-ゼミ .subject-type-badge { background:#16a085; color:white; }
.type-other    { background:#f8f8f8; border-color:#95a5a6; }
.type-other .subject-type-badge { background:#95a5a6; color:white; }

.subject-card.is-new.type-基幹必修 { background:#fff8f7; }
.subject-card.is-new.type-基幹選択 { background:#fffaf3; }
.subject-card.is-new.type-言語     { background:#f2f7ff; }
.subject-card.is-new.type-共通選択 { background:#f4fcf4; }
.subject-card.is-new.type-資格     { background:#faf5ff; }
.subject-card.is-new.type-ゼミ     { background:#e0faf6; }

/* ── 科目種別フィルター ── */
.type-filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  background: white;
  padding: 10px 16px;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  margin-bottom: 14px;
}
.type-filter-label {
  font-size: 0.75rem;
  font-weight: 700;
  color: #6a7f96;
  margin-right: 4px;
  white-space: nowrap;
}

/* 複数選択ヒント */
.type-filter-hint {
  font-size: 0.68rem;
  color: #9ab0c4;
  margin-left: auto;
  white-space: nowrap;
}

.type-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  border: 2px solid transparent;
  background: #f0f4f8;
  color: #666;
  transition: all 0.15s;
  white-space: nowrap;
  user-select: none;
}
.type-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.type-btn .dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

/* 選択中スタイル */
.type-btn.active-all      { background: #1a3a5c; color: white; border-color: #1a3a5c; }
.type-btn.active-基幹必修  { background: #fde8e8; color: #b03030; border-color: #e74c3c; }
.type-btn.active-基幹選択  { background: #fdecd8; color: #a05010; border-color: #e67e22; }
.type-btn.active-言語      { background: #ddeeff; color: #1a5c9c; border-color: #3498db; }
.type-btn.active-共通選択  { background: #ddf5e4; color: #1a6635; border-color: #27ae60; }
.type-btn.active-資格      { background: #ede0f8; color: #6a1a9a; border-color: #8e44ad; }
.type-btn.active-ゼミ      { background: #d5f5ef; color: #0d6655; border-color: #16a085; }
.type-btn.active-その他    { background: #eaeaea; color: #444;    border-color: #95a5a6; }

/* 選択件数バッジ */
.filter-count-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  background: #2a6496;
  color: white;
  font-size: 0.65rem;
  font-weight: 800;
  border-radius: 9px;
  padding: 0 4px;
  margin-left: 2px;
}

.empty-cell { color: #bbb; font-size: 0.68rem; text-align: center; padding: 12px 0; }

/* ── 特別セクション ── */
.special-section {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 18px;
  overflow: hidden;
}
.special-title {
  background: #2a6496;
  color: white;
  padding: 9px 16px;
  font-size: 0.88rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.special-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
  padding: 12px;
}
.special-card {
  border-radius: 6px;
  padding: 9px 11px;
  font-size: 0.75rem;
  line-height: 1.5;
  border-left: 4px solid;
  position: relative;
}
.special-card.is-new { box-shadow: 0 0 0 1.5px #f0b429; }
.special-card.is-new::before {
  content: '★ NEW';
  position: absolute;
  top: -1px; right: -1px;
  background: #f0b429;
  color: #5a3800;
  font-size: 0.55rem;
  font-weight: 900;
  padding: 1px 4px;
  border-radius: 0 6px 0 4px;
  line-height: 1.5;
}
.special-card .s-name { font-weight: 700; font-size: 0.8rem; margin-bottom: 3px; }
.special-card .s-meta { font-size: 0.68rem; color: #666; }
</style>
</head>

<div class="header">
  <h1>令和8年度 人文学部社会福祉学科 授業時間割</h1>
  <p>学年タブで表示範囲を切替。★NEWはその学年から新たに受講できる科目です。</p>
</div>

<div class="year-tabs">
  <button class="year-tab active" onclick="selectYear(1)">1年生</button>
  <button class="year-tab" onclick="selectYear(2)">2年生</button>
  <button class="year-tab" onclick="selectYear(3)">3年生</button>
  <button class="year-tab" onclick="selectYear(4)">4年生</button>
</div>

<div class="term-bar">
  <span class="term-label">学期：</span>
  <button class="term-tab active-spring" id="termTabSpring" onclick="selectTerm('春')">🌸 春学期</button>
  <button class="term-tab" id="termTabAutumn" onclick="selectTerm('秋')">🍂 秋学期</button>
</div>

<div class="content">

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#e74c3c;"></div>基幹必修</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e67e22;"></div>基幹選択</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3498db;"></div>言語</div>
    <div class="legend-item"><div class="legend-dot" style="background:#27ae60;"></div>共通選択</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8e44ad;"></div>資格</div>
    <div class="legend-item"><div class="legend-dot" style="background:#16a085;"></div>ゼミ</div>
    <div class="legend-item"><div class="legend-dot" style="background:#95a5a6;"></div>その他</div>
    <div class="legend-sep"></div>
    <div class="legend-item">
      <span class="new-badge-legend">★ NEW</span>
      <span id="newLabelText">その学年から新たに受講可能な科目</span>
    </div>
    <div class="legend-sep"></div>
    <div class="legend-item"><span class="term-badge term-通" style="font-size:0.68rem;padding:1px 6px;">通年</span>&nbsp;通年科目は春・秋両方に表示</div>
  </div>

  <div class="type-filter-bar">
    <span class="type-filter-label">科目種別：</span>
    <button class="type-btn active-all" id="typeBtn-all"     onclick="toggleType(null)">すべて</button>
    <button class="type-btn" id="typeBtn-基幹必修" onclick="toggleType('基幹必修')"><span class="dot" style="background:#e74c3c"></span>基幹必修</button>
    <button class="type-btn" id="typeBtn-基幹選択" onclick="toggleType('基幹選択')"><span class="dot" style="background:#e67e22"></span>基幹選択</button>
    <button class="type-btn" id="typeBtn-言語"     onclick="toggleType('言語')"    ><span class="dot" style="background:#3498db"></span>言語</button>
    <button class="type-btn" id="typeBtn-共通選択" onclick="toggleType('共通選択')"><span class="dot" style="background:#27ae60"></span>共通選択</button>
    <button class="type-btn" id="typeBtn-資格"     onclick="toggleType('資格')"    ><span class="dot" style="background:#8e44ad"></span>資格</button>
    <button class="type-btn" id="typeBtn-ゼミ"     onclick="toggleType('ゼミ')"    ><span class="dot" style="background:#16a085"></span>ゼミ</button>
    <button class="type-btn" id="typeBtn-その他"   onclick="toggleType('other')"  ><span class="dot" style="background:#95a5a6"></span>その他</button>
    <span class="type-filter-hint" id="filterHint">複数選択可</span>
  </div>

  <div class="timetable-wrapper">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="timetableBody"></tbody>
    </table>
  </div>

  <div class="special-section" id="ondemandSection">
    <div class="special-title">📱 オンデマンド科目</div>
    <div class="special-grid" id="ondemandGrid"></div>
  </div>

  <div class="special-section" id="intensiveSection">
    <div class="special-title">📅 集中講義・特別科目</div>
    <div class="special-grid" id="intensiveGrid"></div>
  </div>

</div><!-- /content -->

const DAYS    = ['月','火','水','木','金','土'];
const PERIODS = ['1限','2限','3限','4限','5限'];
const TIMES   = ['9:00〜10:30','10:40〜12:10','13:00〜14:30','14:40〜16:10','16:20〜17:50'];

let currentYear = 1;
let currentTerm = '春';
// ── 変更点①：複数選択用Set（null = すべて）
let selectedTypes = null; // null or Set

function typeClass(type) {
  return 'type-' + ({'基幹必修':'基幹必修','基幹選択':'基幹選択','言語':'言語','共通選択':'共通選択','資格':'資格','ゼミ':'ゼミ'}[type] || 'other');
}
function typeLabel(type) { return type || 'その他'; }

function isVisible(e, yr) {
  return e.type === 'ゼミ' ? e.grade === yr : e.grade <= yr;
}
function isNew(e, yr) {
  if (yr === 1) return false;
  return e.type === 'ゼミ' ? e.grade === yr : e.grade === yr;
}
function matchesTerm(eTerm, sel) {
  if (eTerm === '通') return true;
  if (eTerm === sel) return true;
  if (eTerm && eTerm.startsWith(sel)) return true;
  return false;
}

// ── 変更点②：複数選択対応のmatchesType
function matchesType(e) {
  if (selectedTypes === null) return true; // すべて
  const key = e.type && ['基幹必修','基幹選択','言語','共通選択','資格','ゼミ'].includes(e.type)
    ? e.type : 'other';
  return selectedTypes.has(key);
}

function makeCard(entry, yr) {
  const tc = typeClass(entry.type);
  const newCls = isNew(entry, yr) ? ' is-new' : '';
  const nenkan = entry.term === '通'
    ? `<span class="term-badge term-通">通年</span>` : '';
  return `<div class="subject-card ${tc}${newCls}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:3px;margin-bottom:2px;">
      <span class="subject-type-badge">${typeLabel(entry.type)}</span>
      ${nenkan}
    </div>
    <div class="subject-name">${entry.name}</div>
    <div class="subject-meta">${entry.teacher}${entry.room ? ' / ' + entry.room : ''}</div>
  </div>`;
}

  const thead = document.getElementById('tableHead');
  let html = '<tr><th class="day-col-header">曜日</th>';
  PERIODS.forEach((p, i) => {
    html += `<th class="period-col">
      <div class="period-head-inner">
        <div class="period-num">${p}</div>
        <div class="period-time">${TIMES[i]}</div>
      </div>
    </th>`;
  });
  html += '</tr>';
  thead.innerHTML = html;
}

function renderBody(yr, term) {
  const tbody = document.getElementById('timetableBody');
  let html = '';
  DAYS.forEach(day => {
    html += `<tr><td class="day-label">${day}<br><span style="font-size:0.6rem;font-weight:400;color:#6a7f96;">曜日</span></td>`;
    PERIODS.forEach(period => {
      const entries = DATA.regular.filter(e =>
        e.day === day && e.period === period && isVisible(e, yr) && matchesTerm(e.term, term) && matchesType(e)
      );
      if (entries.length === 0) {
        html += `<td class="slot"><div class="empty-cell">—</div></td>`;
      } else {
        html += `<td class="slot">${entries.map(e => makeCard(e, yr)).join('')}</td>`;
      }
    });
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function makeSpecialCard(entry, yr) {
  const tc = typeClass(entry.type);
  const newCls = isNew(entry, yr) ? ' is-new' : '';
  return `<div class="special-card ${tc}${newCls}">
    <div class="s-name">${entry.name}</div>
    <div style="margin:3px 0;"><span class="subject-type-badge">${typeLabel(entry.type)}</span></div>
    <div class="s-meta">${entry.teacher}　${entry.units}単位</div>
  </div>`;
}

function renderSpecial(yr, term) {
  const odSec  = document.getElementById('ondemandSection');
  const intSec = document.getElementById('intensiveSection');
  const odGrid = document.getElementById('ondemandGrid');
  const intGrid= document.getElementById('intensiveGrid');

  const odItems  = DATA.ondemand.filter(e  => isVisible(e, yr) && matchesTerm(e.term, term) && matchesType(e));
  const intItems = DATA.intensive.filter(e => isVisible(e, yr) && matchesTerm(e.term, term) && matchesType(e));

  odSec.style.display  = odItems.length  ? '' : 'none';
  intSec.style.display = intItems.length ? '' : 'none';
  odGrid.innerHTML  = odItems.map(e  => makeSpecialCard(e, yr)).join('');
  intGrid.innerHTML = intItems.map(e => makeSpecialCard(e, yr)).join('');
}

function render() {
  renderBody(currentYear, currentTerm);
  renderSpecial(currentYear, currentTerm);
  const lbl = document.getElementById('newLabelText');
  if (currentYear === 1) {
    lbl.textContent = '（2年生以上のタブで有効）';
    lbl.style.color = '#aaa';
  } else {
    lbl.textContent = `${currentYear}年生から新たに受講できる科目`;
    lbl.style.color = '#555';
  }
}

function selectYear(yr) {
  currentYear = yr;
  document.querySelectorAll('.year-tab').forEach((t, i) => {
    t.classList.toggle('active', i + 1 === yr);
  });
  render();
}

function selectTerm(term) {
  currentTerm = term;
  document.getElementById('termTabSpring').className = 'term-tab' + (term === '春' ? ' active-spring' : '');
  document.getElementById('termTabAutumn').className = 'term-tab' + (term === '秋' ? ' active-autumn' : '');
  render();
}

// ── 変更点③：複数選択のtoggleType
const TYPE_KEYS = ['基幹必修','基幹選択','言語','共通選択','資格','ゼミ','その他'];

function toggleType(t) {
  if (t === null) {
    // 「すべて」 → 全選択解除
    selectedTypes = null;
  } else {
    if (selectedTypes === null) {
      // 「すべて」状態から初めて選ぶ → Setを作成してその1つだけ選択
      selectedTypes = new Set([t]);
    } else {
      if (selectedTypes.has(t)) {
        selectedTypes.delete(t);
        // 空になったらすべてに戻す
        if (selectedTypes.size === 0) selectedTypes = null;
      } else {
        selectedTypes.add(t);
      }
    }
  }
  updateTypeButtons();
  render();
}

// ── 変更点④：ボタン表示を複数選択対応で更新
function updateTypeButtons() {
  const isAll = selectedTypes === null;
  const count = isAll ? 0 : selectedTypes.size;

  // 「すべて」ボタン
  const allBtn = document.getElementById('typeBtn-all');
  allBtn.className = 'type-btn' + (isAll ? ' active-all' : '');
  allBtn.innerHTML = isAll ? 'すべて' : `すべて <span class="filter-count-badge">${count}</span>`;

  // ヒントテキスト更新
  const hint = document.getElementById('filterHint');
  hint.textContent = isAll ? '複数選択可' : `${count}種別選択中・「すべて」で解除`;

  // 各種別ボタン
  TYPE_KEYS.forEach(k => {
    const id = 'typeBtn-' + k;
    const btn = document.getElementById(id);
    if (!btn) return;
    const key = k === 'その他' ? 'other' : k;
    const isActive = !isAll && selectedTypes.has(key);
    btn.className = 'type-btn' + (isActive ? ' active-' + k : '');
  });
}

// 初期化
renderHead();
selectYear(1);
</script>
</body>
</html>
